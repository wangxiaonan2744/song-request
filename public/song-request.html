<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Submit Your Song</title>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
      import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

      // For Firebase JS SDK v7.20.0 and later, measurementId is optional
      const firebaseConfig = {
        apiKey: "AIzaSyDdO0OUFx2QIe74IdfN1CTXwWxQqoIzuHs",
        authDomain: "song-request-ddc2e.firebaseapp.com",
        projectId: "song-request-ddc2e",
        storageBucket: "song-request-ddc2e.firebasestorage.app",
        messagingSenderId: "498812073299",
        appId: "1:498812073299:web:b5ced546f838983cb21da6",
        measurementId: "G-8X16XBXZ1C"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      async function submitSong(e) {
        e.preventDefault();
        const song = document.getElementById("songInput").value;

        try {
          await addDoc(collection(db, "songRequests"), {
            song,
            status: "pending",
            createdAt: serverTimestamp()
          });
          alert("🎉 Your song has been submitted!");
          document.getElementById("songForm").reset();
        } catch (err) {
          console.error("Error writing document:", err);
          alert("Something went wrong. Please try again.");
        }
      }

      window.onload = () => {
        document.getElementById("songForm").addEventListener("submit", submitSong);
      };
    </script>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
      }
      input {
        padding: 10px;
        width: 300px;
        margin-bottom: 10px;
      }
      button {
        padding: 10px 20px;
        background: #0070ba;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background: #005c99;
      }
    </style>
  </head>
  <body>
    <h1>🎶 Submit Your Song Request 🎶</h1>
    <p>Thanks for your payment! Enter your song below:</p>
    <form id="songForm">
      <input type="text" id="songInput" placeholder="Song title and artist" required />
      <br />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
