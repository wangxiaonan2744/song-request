<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Submit Your Song</title>
  </head>
  <body>
    <h1>Thanks for your payment! 🎶</h1>
    <p>Enter your song request below:</p>
    <form id="songForm">
      <input type="text" id="songInput" placeholder="Song title and artist" required>
      <button type="submit">Submit</button>
    </form>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
      import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

      // For Firebase JS SDK v7.20.0 and later, measurementId is optional
      const firebaseConfig = {
        apiKey: "AIzaSyDdO0OUFx2QIe74IdfN1CTXwWxQqoIzuHs",
        authDomain: "song-request-ddc2e.firebaseapp.com",
        projectId: "song-request-ddc2e",
        storageBucket: "song-request-ddc2e.firebasestorage.app",
        messagingSenderId: "498812073299",
        appId: "1:498812073299:web:b5ced546f838983cb21da6",
        measurementId: "G-8X16XBXZ1C"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const form = document.getElementById("songForm");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const song = document.getElementById("songInput").value;
        await addDoc(collection(db, "songRequests"), {
          song,
          createdAt: new Date(),
          status: "pending"
        });
        alert("🎉 Your song has been submitted!");
        form.reset();
      });
    </script>
  </body>
</html>
