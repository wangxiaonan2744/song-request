    <!-- Load Firebase SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";

      // For Firebase JS SDK v7.20.0 and later, measurementId is optional
      const firebaseConfig = {
        apiKey: "AIzaSyDdO0OUFx2QIe74IdfN1CTXwWxQqoIzuHs",
        authDomain: "song-request-ddc2e.firebaseapp.com",
        projectId: "song-request-ddc2e",
        storageBucket: "song-request-ddc2e.firebasestorage.app",
        messagingSenderId: "498812073299",
        appId: "1:498812073299:web:b5ced546f838983cb21da6",
        measurementId: "G-8X16XBXZ1C"
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);

    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
      }
      h1 {
        color: #333;
      }
      #paypal-button-container {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>🎵 Request a Song for $1 🎵</h1>
    <p>Click below to pay with PayPal and unlock the request form.</p>

    <!-- PayPal button container -->
    <div id="paypal-button-container"></div>

    <script>
      paypal.Buttons({
        style: {
          layout: 'vertical',
          color:  'blue',
          shape:  'rect',
          label:  'paypal'
        },
        createOrder: function(data, actions) {
          return actions.order.create({
            purchase_units: [{
              amount: {
                value: '1.00'  // $1
              }
            }]
          });
        },
        onApprove: function(data, actions) {
          return actions.order.capture().then(function(details) {
            console.log("Payment approved:", details);

            // ✅ After payment, redirect to the song request form
            window.location.href = "/song-request.html";
          });
        },
        onCancel: function (data) {
          alert("Payment cancelled.");
        },
        onError: function (err) {
          console.error("PayPal Checkout error:", err);
          alert("Something went wrong with PayPal.");
        }
      }).render('#paypal-button-container');
    </script>
  </body>
</html>
