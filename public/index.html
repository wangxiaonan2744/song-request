<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Song Request</title>
  </head>
  <body>
    <h1>🎵 Request a Song for $1 🎵</h1>
    <p>Scan the QR code or click below to get started.</p>
    <div id="paypal-button-container"></div>

    <script>
      paypal.Buttons({
        style: {
          layout: 'vertical',
          color:  'blue',
          shape:  'rect',
          label:  'paypal'
        },
        createOrder: function(data, actions) {
          return actions.order.create({
            purchase_units: [{
              amount: {
                value: '1.00'  // $1
              }
            }]
          });
        },
        onApprove: function(data, actions) {
          return actions.order.capture().then(function(details) {
            // After successful payment, redirect to song request form
            window.location.href = "/song-request.html";
          });
        }
      }).render('#paypal-button-container');
    </script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
      import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-functions.js";

      // For Firebase JS SDK v7.20.0 and later, measurementId is optional
      const firebaseConfig = {
        apiKey: "AIzaSyDdO0OUFx2QIe74IdfN1CTXwWxQqoIzuHs",
        authDomain: "song-request-ddc2e.firebaseapp.com",
        projectId: "song-request-ddc2e",
        storageBucket: "song-request-ddc2e.firebasestorage.app",
        messagingSenderId: "498812073299",
        appId: "1:498812073299:web:b5ced546f838983cb21da6",
        measurementId: "G-8X16XBXZ1C"
      };

      const app = initializeApp(firebaseConfig);
      const functions = getFunctions(app);

      const payButton = document.getElementById("payButton");

      payButton.addEventListener("click", async () => {
        const createCheckoutSession = httpsCallable(functions, 'createCheckoutSession');
        const result = await createCheckoutSession();
        const sessionId = result.data.id;

        // Redirect to Stripe Checkout
        window.location.href = `https://checkout.stripe.com/pay/${sessionId}`;
      });
    </script>
  </body>
</html>
